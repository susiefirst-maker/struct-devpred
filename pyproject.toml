[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "struct-devpred"
version = "0.1.0"
description = "Antibody developability benchmark study: do structure-informed descriptors beat sequence baselines under leakage-resistant cross-validation?"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Di Wu" }]
keywords = ["antibody", "developability", "benchmark", "biologics", "machine-learning"]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyarrow>=14.0",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
gbm = ["xgboost>=2.0", "lightgbm>=4.0"]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["struct_devpred*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
  "slow: marks tests as slow (deselect with -m 'not slow')",
  "integration: marks integration tests requiring sibling repo artifacts",
]

[tool.ruff]
line-length = 100
target-version = "py310"
